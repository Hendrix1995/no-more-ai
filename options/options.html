<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>No More AI Music 설정</title>
  <style>
    body { max-width: 640px; margin: 32px auto; padding: 0 16px; font: 14px/1.6 system-ui, sans-serif; color: #222; }
    h1 { font-size: 20px; }
    h2 { font-size: 15px; margin-top: 28px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
    .muted { color: #777; font-size: 12px; }
    textarea { width: 100%; height: 180px; font: 13px/1.5 ui-monospace, monospace; box-sizing: border-box; }
    input[type=number] { width: 70px; }
    ul { list-style: none; padding: 0; margin: 6px 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-radius: 4px; }
    li:nth-child(odd) { background: #f6f6f6; }
    li button { border: none; background: none; color: #c0262d; cursor: pointer; }
    .add { display: flex; gap: 6px; }
    .add input { flex: 1; }
    label { display: block; margin: 6px 0; }
    #save { margin-top: 24px; padding: 8px 20px; }
    #saved { margin-left: 8px; color: #1b7f3b; }
    .support { margin-top: 40px; padding-top: 12px; border-top: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1 data-i18n="optTitle">No More AI Music 설정</h1>

  <h2 data-i18n="optLanguage">언어</h2>
  <select id="language">
    <option value="auto" data-i18n="optLanguageAuto">자동 (브라우저 언어)</option>
    <option value="ko">한국어</option>
    <option value="en">English</option>
  </select>

  <h2 data-i18n="optCriteria">판별 기준</h2>
  <label><input type="checkbox" id="useSyntheticLabel" /> <span data-i18n="optSyntheticLabel"></span></label>
  <label>
    <input type="checkbox" id="useUploadRate" /> <span data-i18n="optUploadRateBefore"></span>
    <input type="number" id="uploadRateThreshold" min="1" /> <span data-i18n="optUploadRateAfter"></span>
  </label>
  <label><span data-i18n="optLookahead"></span> <input type="number" id="lookahead" min="0" max="30" /></label>

  <h2 data-i18n="optKeywords">키워드</h2>
  <p class="muted" data-i18n="optKeywordsHelp"></p>
  <textarea id="keywords"></textarea>

  <h2 data-i18n="optBlocked">차단한 채널</h2>
  <ul id="blockedList"></ul>
  <div class="add"><input id="blockedInput" data-i18n-placeholder="optBlockedPlaceholder" /><button data-add="blocked" data-i18n="optAdd"></button></div>

  <h2 data-i18n="optAllowed">허용한 채널</h2>
  <p class="muted" data-i18n="optAllowedHelp"></p>
  <ul id="allowedList"></ul>
  <div class="add"><input id="allowedInput" data-i18n-placeholder="optAllowedPlaceholder" /><button data-add="allowed" data-i18n="optAdd"></button></div>

  <button id="save" data-i18n="optSave"></button><span id="saved"></span>

  <p class="support muted">
    <span data-i18n="optSupportBefore"></span><a href="https://buymeacoffee.com/hendrix1995" target="_blank" rel="noopener">Buy Me a Coffee</a><span data-i18n="optSupportAfter"></span>
  </p>

  <script src="../src/settings.js"></script>
  <script src="../src/i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
